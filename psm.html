<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSM · TV</title>
<style>
  /* TV-Fassung 16:9 (1920 × 1080, skaliert bis 4K). Farbcode wie Stationstafeln v2:
     Strom rot, Spannung blau, Feld grün, Kraft schwarz, Bewegung grau. Design HTL-Grün, Rot nie als Designfarbe. */
  :root {
    --green: #9CCE2B; --green-dark: #6D9037; --grey: #595B60; --ink: #1F2124;
    --line: #D8DBD3; --tint: #F5FAEA; --fans: #F3F4F1;
    --cur: #D7261E; --volt: #1F5FBF; --fld: #2E9B3A; --frc: #000000; --move: #595B60;
    --nord: #4A4D52; --sued: #CDD1D6; --cu: #B8733A;
  }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
  body.idle { cursor: none; }
  #tv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .kick { font: 600 32px Bahnschrift, "Roboto Condensed", "sans-serif-condensed", "Segoe UI", sans-serif; letter-spacing: .09em; fill: var(--green-dark); }
  .head { font: 700 80px Bahnschrift, "Roboto Condensed", "sans-serif-condensed", "Segoe UI", sans-serif; fill: var(--ink); }
  .brand { font: 700 40px Bahnschrift, "Roboto Condensed", "sans-serif-condensed", "Segoe UI", sans-serif; fill: var(--ink); }
  .brand2 { font: 28px "Segoe UI", Arial, sans-serif; fill: var(--grey); }
  .capn { font: 700 40px Bahnschrift, "Roboto Condensed", "sans-serif-condensed", "Segoe UI", sans-serif; fill: var(--green-dark); }
  .capt { font: 600 56px Bahnschrift, "Roboto Condensed", "sans-serif-condensed", "Segoe UI", sans-serif; fill: var(--ink); transition: opacity .3s; }
  .lab { font: 40px "Segoe UI", Arial, sans-serif; fill: var(--ink); }
  .labb { font: 700 40px "Segoe UI", Arial, sans-serif; fill: var(--ink); }
  .labs { font: 32px "Segoe UI", Arial, sans-serif; fill: var(--grey); }
  .math { font: italic 66px "Cambria Math", Cambria, "Times New Roman", serif; fill: var(--ink); }
  .vI, .vB, .vF { font: italic 700 64px "Cambria Math", Cambria, serif; paint-order: stroke; stroke: #fff; stroke-width: 12px; stroke-linejoin: round; }
  .vI { fill: var(--cur); } .vB { fill: var(--fld); } .vF { fill: #000; }
  .pole { font: 700 56px Bahnschrift, "Roboto Condensed", "sans-serif-condensed", "Segoe UI", sans-serif; }
  .legend { font: 30px "Segoe UI", Arial, sans-serif; fill: var(--grey); }
  .fade { transition: opacity .3s; }
  #pause { display: none; }
  body.paused:not(.shot):not(.tv) #pause { display: inline; }   /* in tv.html zeigt die Playlist die Pause an */
</style>

<body>

    <rect x="1668" y="246" width="10" height="32" rx="2" fill="#fff"/><rect x="1686" y="246" width="10" height="32" rx="2" fill="#fff"/>
    <text x="1712" y="275" style="font:600 36px Bahnschrift,'Roboto Condensed','sans-serif-condensed','Segoe UI',sans-serif;fill:#fff">Pause</text></g>

<script>
"use strict";
/* ================= Hilfsfunktionen ================= */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function el(parent, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}
const f1 = v => (Math.round(v * 10) / 10).toString();
const pts = a => a.map(p => f1(p[0]) + "," + f1(p[1])).join(" ");
const poly = a => "M" + a.map(p => f1(p[0]) + "," + f1(p[1])).join("L") + "Z";
const PI = Math.PI, rad = d => d * PI / 180;
const smooth = x => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const clamp01 = x => Math.max(0, Math.min(1, x));
const ramp = (a, b, t0, t1, t) => a + (b - a) * smooth((t - t0) / (t1 - t0));
/* Pfeil als gefüllte Fläche: Schaftbreite w, Spitzenbreite hw, Spitzenlänge hl */
function arrowD(x1, y1, x2, y2, w, hw, hl) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  hl = Math.min(hl, L * 0.7);
  const bx = x2 - ux * hl, by = y2 - uy * hl;
  return poly([[x1 + nx * w / 2, y1 + ny * w / 2], [bx + nx * w / 2, by + ny * w / 2], [bx + nx * hw / 2, by + ny * hw / 2], [x2, y2],
               [bx - nx * hw / 2, by - ny * hw / 2], [bx - nx * w / 2, by - ny * w / 2], [x1 - nx * w / 2, y1 - ny * w / 2]]);
}
/* kleine Pfeilspitze an (x, y) in Richtung (dx, dy) */
function headD(x, y, dx, dy, len, wid) {
  const L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  return poly([[x + ux * len / 2, y + uy * len / 2], [x - ux * len / 2 + nx * wid / 2, y - uy * len / 2 + ny * wid / 2], [x - ux * len / 2 - nx * wid / 2, y - uy * len / 2 - ny * wid / 2]]);
}
/* Symbole für Strom senkrecht zur Bildebene: ⊗ hinein, ⊙ heraus */
function crossD(x, y, r) { const a = r * 0.62; return `M${f1(x - a)},${f1(y - a)}L${f1(x + a)},${f1(y + a)}M${f1(x + a)},${f1(y - a)}L${f1(x - a)},${f1(y + a)}`; }
/* Legende unten: [Art, Text]; Art = cur | volt | fld | frc | move */
function legend(items) {
  const g = $("legend"); let x = 60;
  const col = { cur: "#D7261E", volt: "#1F5FBF", fld: "#2E9B3A", frc: "#000", frc0: "#fff", move: "#595B60" };
  for (const [k, txt] of items) {
    const f = k === "frc" || k === "frc0", w = f ? 9 : 5, c = col[k];   // frc0: hohler Kraftpfeil (Gegenkraft)
    el(g, "path", { d: arrowD(x, 1028, x + 64, 1028, w, f ? 26 : 20, f ? 24 : 18), fill: c,
                    ...(k === "frc0" ? { stroke: "#000", "stroke-width": 3, "stroke-linejoin": "round" } : {}) });
    const t = el(g, "text", { x: x + 78, y: 1039, class: "legend" }, txt);
    x += 78 + txt.length * 15 + 56;
  }
}
/* Rechenqualität: 1 = volle Auflösung. Auf langsamen Geräten (z. B. Android-TV) setzt der Player QUAL bis auf 2 hoch,
   dann rechnen Höhenlinien und Feldpfeile auf einem gröberen Raster (etwa ein Viertel der Rechenzeit). */
let QUAL = 1;
/* Höhenlinien (Marching Squares) einer Funktion F(x, y) auf dem Raster h; levels aufsteigend sortiert.
   Liefert einen Pfad aus Einzelstrecken (mit runden Linienenden sieht das wie durchgehende Linien aus).
   Optional: Vpre = schon berechnete Rasterwerte (Zeile für Zeile, (nx+1)·(ny+1) Werte). */
function contourPath(F, x0, y0, x1, y1, h, levels, Vpre) {
  if (!Vpre) h *= QUAL;
  const nx = Math.ceil((x1 - x0) / h), ny = Math.ceil((y1 - y0) / h), W = nx + 1;
  const V = Vpre || new Float64Array(W * (ny + 1));
  if (!Vpre) for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) V[j * W + i] = F(x0 + i * h, y0 + j * h);
  // schnelle Fassung (wichtig für langsame Geräte): keine Hilfsfunktionen und Arrays pro Zelle, Text direkt anhängen
  let out = "";
  const nL = levels.length, r = v => Math.round(v * 10) / 10;
  const seg = (ax, ay, bx, by) => { out += "M" + r(ax) + "," + r(ay) + "L" + r(bx) + "," + r(by); };
  for (let j = 0; j < ny; j++) {
    const Y = y0 + j * h, row = j * W;
    for (let i = 0; i < nx; i++) {
      const a = V[row + i], b = V[row + i + 1], c = V[row + W + i + 1], d = V[row + W + i];
      const mn = Math.min(a, b, c, d), mx = Math.max(a, b, c, d);
      if (!isFinite(mn) || !isFinite(mx)) continue;
      let lo = 0, hi = nL;
      while (lo < hi) { const m = (lo + hi) >> 1; if (levels[m] < mn) lo = m + 1; else hi = m; }
      if (lo >= nL || levels[lo] > mx) continue;
      const X = x0 + i * h;
      for (let k = lo; k < nL && levels[k] <= mx; k++) {
        const L = levels[k];
        const code = (a > L ? 8 : 0) | (b > L ? 4 : 0) | (c > L ? 2 : 0) | (d > L ? 1 : 0);
        if (code === 0 || code === 15) continue;
        // Schnittpunkte auf den Kanten oben (a–b), rechts (b–c), unten (d–c), links (a–d)
        switch (code) {
          case 1: case 14: seg(X, Y + h * (L - a) / (d - a), X + h * (L - d) / (c - d), Y + h); break;
          case 2: case 13: seg(X + h * (L - d) / (c - d), Y + h, X + h, Y + h * (L - b) / (c - b)); break;
          case 3: case 12: seg(X, Y + h * (L - a) / (d - a), X + h, Y + h * (L - b) / (c - b)); break;
          case 4: case 11: seg(X + h * (L - a) / (b - a), Y, X + h, Y + h * (L - b) / (c - b)); break;
          case 6: case 9: seg(X + h * (L - a) / (b - a), Y, X + h * (L - d) / (c - d), Y + h); break;
          case 7: case 8: seg(X, Y + h * (L - a) / (d - a), X + h * (L - a) / (b - a), Y); break;
          case 5: seg(X, Y + h * (L - a) / (d - a), X + h * (L - a) / (b - a), Y);
                  seg(X + h * (L - d) / (c - d), Y + h, X + h, Y + h * (L - b) / (c - b)); break;
          case 10: seg(X + h * (L - a) / (b - a), Y, X + h, Y + h * (L - b) / (c - b));
                   seg(X, Y + h * (L - a) / (d - a), X + h * (L - d) / (c - d), Y + h); break;
        }
      }
    }
  }
  return out;
}
/* Kreuzungspunkte einer Höhenlinie mit einer Strecke (für Feldpfeile) */
function crossings(F, p0, p1, n, levels) {
  n = Math.max(20, Math.round(n / QUAL));
  const res = []; let prev = F(p0[0], p0[1]);
  for (let s = 1; s <= n; s++) {
    const x = p0[0] + (p1[0] - p0[0]) * s / n, y = p0[1] + (p1[1] - p0[1]) * s / n, v = F(x, y);
    for (const L of levels) if ((prev - L) * (v - L) < 0) {
      const q = (L - prev) / (v - prev), xs = x - (p1[0] - p0[0]) / n * (1 - q), ys = y - (p1[1] - p0[1]) / n * (1 - q);
      res.push([xs, ys]);
    }
    prev = v;
  }
  return res;
}
/* Wie contourPath, aber die Einzelstrecken werden zu durchgehenden Linien verkettet (nötig für Strichlierung) */
function contourPolylines(F, x0, y0, x1, y1, h, levels, Vpre) {
  const raw = contourPath(F, x0, y0, x1, y1, h, levels, Vpre);
  const segs = [], ends = new Map();
  const re = /M([-\d.]+),([-\d.]+)L([-\d.]+),([-\d.]+)/g; let m;
  while ((m = re.exec(raw))) {
    const a = m[1] + "," + m[2], b = m[3] + "," + m[4], i = segs.length;
    segs.push([a, b, false]);
    for (const k of [a, b]) { if (!ends.has(k)) ends.set(k, []); ends.get(k).push(i); }
  }
  const out = [];
  const nextFrom = (k, skip) => { for (const j of ends.get(k) || []) if (!segs[j][2] && j !== skip) return j; return -1; };
  for (let i = 0; i < segs.length; i++) {
    if (segs[i][2]) continue;
    segs[i][2] = true;
    const line = [segs[i][0], segs[i][1]];
    for (const dir of [1, 0]) {                 // erst nach vorn, dann nach hinten verlängern
      let k = dir ? line[line.length - 1] : line[0], j;
      while ((j = nextFrom(k, -1)) >= 0) {
        segs[j][2] = true;
        const nk = segs[j][0] === k ? segs[j][1] : segs[j][0];
        if (dir) line.push(nk); else line.unshift(nk);
        k = nk;
      }
    }
    out.push("M" + line.join("L"));
  }
  return out.join("");
}

/* ================= Ablauf ================= */
const LOOP = 52.5;
const PH = [
  { t: 0,    txt: "Drei Spulen U, V, W – drei Ströme, je 120° versetzt" },
  { t: 6,    txt: "Das Statorfeld dreht sich im Uhrzeigersinn" },
  { t: 13,   txt: "Dazu das Feld des Dauermagneten: Er läuft synchron mit" },
  { t: 20,   txt: "Zeit angehalten: Ohne Last zeigt der Rotor ins Statorfeld" },
  { t: 23.5, txt: "Halbe Last: Der Rotor bleibt um ϑ = 15° zurück" },
  { t: 28.5, txt: "Volle Last: ϑ = 30°, die Feldlinien ziehen schräg" },
  { t: 33.5, txt: "Zeit läuft weiter: synchron, aber um ϑ versetzt" },
  { t: 39.5, txt: "Mehr Frequenz – schneller: n = 60 · f / p" },
  { t: 46.5, txt: "Frequenz auf null – der Motor bleibt stehen" },
];
const FR0 = 20, FR1 = 33.5;                             // Zeit angehalten (Gedankenexperiment)
/* Frequenz am Umrichter (Hz); gezeigt wird in Zeitlupe (SLOW-fach langsamer) */
const SLOW = 25;
function fAt(t) {
  if (t < 0.5) return 0;
  if (t < 3) return ramp(0, 5, 0.5, 3, t);
  if (t < 39.5) return 5;
  if (t < 41) return ramp(5, 15, 39.5, 41, t);          // länger bei niedriger, kurz bei hoher Drehzahl
  if (t < 42.5) return 15;
  if (t < 43.7) return ramp(15, 30, 42.5, 43.7, t);
  if (t < 44.9) return 30;
  if (t < 45.9) return ramp(30, 50, 44.9, 45.9, t);
  if (t < 46.7) return 50;
  if (t < 49.5) return ramp(50, 0, 46.7, 49.5, t);
  return 0;
}
/* Zeitfaktor: 1 = Zeit läuft, 0 = angehalten (kurz weich ein- und ausgeblendet) */
const warp = t => (t < FR0 - 0.4 ? 1 : t < FR0 ? 1 - smooth((t - FR0 + 0.4) / 0.4) : t < FR1 ? 0 : smooth((t - FR1) / 0.4));
/* Polradwinkel (Grad): Drehmoment M = M_k · sin ϑ; volle Last = halbes Kippmoment → ϑ = 30°.
   Die Last wird bei angehaltener Zeit erhöht: Das Statorfeld steht, der Rotor fällt zurück. */
function thetaL(t) {
  if (t < 24) return 0;
  if (t < 25.5) return ramp(0, 15, 24, 25.5, t);
  if (t < 29) return 15;
  if (t < 30.5) return ramp(15, 30, 29, 30.5, t);
  if (t < 49) return 30;
  return ramp(30, 0, 49, 51.5, t);
}
/* elektrischer Winkel ωt; über die Schleife auf ganze Umläufe gerundet → nahtlos */
const DT = 0.005, NT = Math.round(LOOP / DT) + 1, TH = new Float64Array(NT);
(() => {
  for (let i = 1; i < NT; i++) { const t = (i - 0.5) * DT; TH[i] = TH[i - 1] + 2 * PI * fAt(t) * warp(t) / SLOW * DT; }
  const k = Math.round(TH[NT - 1] / (2 * PI)) * 2 * PI / TH[NT - 1];
  for (let i = 0; i < NT; i++) TH[i] *= k;
})();
const thAt = t => { const x = Math.max(0, Math.min(NT - 1.001, t / DT)), i = Math.floor(x); return TH[i] + (TH[i + 1] - TH[i]) * (x - i); };

/* Spulen wie Tafel 5 (von oben gesehen): U oben, V rechts unten, W links unten.
   i_U = cos ωt, i_V = cos(ωt − 120°), i_W = cos(ωt − 240°). Positiver Strom: Feld zeigt von der Spule weg (zur Mitte). */
const PHS = [
  { n: "U", ph: 0,          a: 90,  col: "#D7261E" },
  { n: "V", ph: 2 * PI / 3, a: -30, col: "#7A1712" },
  { n: "W", ph: 4 * PI / 3, a: 210, col: "#EE8A84" },
];

/* ================= Feldberechnung (ebenes Feld, Blick von oben) =================
   Vektorpotential A (z-Komponente), Feldlinien = Höhenlinien, B = (∂A/∂Y, −∂A/∂X).
   Stator: Zahnspulenwicklung (q = ½, wie bei Nabenmotoren): drei breite Spulen U, V, W über je 120° Bogen.
   Die Spulenseiten liegen in Nuten nahe am Luftspalt (je 9 Stromfäden bei a ± 50° ± 10°). Bei i > 0 fließt der Strom
   auf der Seite a − 50° aus der Ebene heraus (⊙), auf der Seite a + 50° hinein (⊗) → Feld von der Spule weg zur Mitte.
   Rotor: homogen magnetisierter Zylinder (Radius RR), innen homogenes Feld in Richtung des Nordpols, außen Dipolfeld. */
const CX = 560, CY = 665, RR = 118, RB = 215, DEL = 50, SPR = 10, RS1 = 260, RS2 = 320;
const FIL = PHS.map(c => {
  const o = [];
  for (const r of [RS1, (RS1 + RS2) / 2, RS2]) for (const d of [-SPR, 0, SPR]) for (const [ang, s] of [[c.a - DEL + d, 1], [c.a + DEL + d, -1]])
    o.push([r * Math.cos(rad(ang)), r * Math.sin(rad(ang)), s / 9]);
  return o;
});
const gPhase = (k, X, Y) => { let A = 0; for (const [x, y, s] of FIL[k]) A -= s * 0.5 * Math.log((X - x) * (X - x) + (Y - y) * (Y - y)); return A; };
const aStat = (X, Y, cur) => cur[0] * gPhase(0, X, Y) + cur[1] * gPhase(1, X, Y) + cur[2] * gPhase(2, X, Y);
const aRot = (X, Y, psi, kap) => kap * (Math.cos(psi) * Y - Math.sin(psi) * X) / Math.max(X * X + Y * Y, RR * RR);
/* Raster der Bohrung einmal vorausberechnen: Feld jeder Phase bei Strom 1 */
const GH = 6, GN = Math.ceil(2 * RB / GH), GW = GN + 1, GX0 = CX - RB, GY0 = CY - RB;
const GK = [0, 1, 2].map(k => { const a = new Float64Array(GW * GW); for (let j = 0; j < GW; j++) for (let i = 0; i < GW; i++) a[j * GW + i] = gPhase(k, GX0 + i * GH - CX, CY - GY0 - j * GH); return a; });
const GIN = []; for (let j = 0; j < GW; j++) for (let i = 0; i < GW; i++) if ((i * GH - RB) ** 2 + (j * GH - RB) ** 2 <= RB * RB) GIN.push(j * GW + i);
const GV = new Float64Array(GW * GW);
/* Eichung: Statorfeld in der Mitte bei ωt = 0 */
const S0 = (() => { const c = [1, -0.5, -0.5], e = 0.5; return Math.hypot((aStat(0, e, c) - aStat(0, -e, c)) / (2 * e), (aStat(e, 0, c) - aStat(-e, 0, c)) / (2 * e)); })();
const KAP = 1.15 * S0 * RR * RR, DA = 43 * S0;                                  // Rotorfeld innen ≈ 1,15 × Statorfeld; Linienabstand

/* ================= Bühne: Motor ================= */
const st = $("stage");
const P = (r, deg) => [CX + r * Math.cos(rad(deg)), CY - r * Math.sin(rad(deg))];
const sector = (r1, r2, a1, a2) => { const p1 = P(r2, a1), p2 = P(r2, a2), p3 = P(r1, a2), p4 = P(r1, a1);
  return `M${f1(p1[0])},${f1(p1[1])}A${r2},${r2} 0 0 0 ${f1(p2[0])},${f1(p2[1])}L${f1(p3[0])},${f1(p3[1])}A${r1},${r1} 0 0 1 ${f1(p4[0])},${f1(p4[1])}Z`; };
el(st, "text", { x: 60, y: 350, class: "labs" }, "Von oben gesehen");
const defs = el(st, "defs", {});
const cp = el(defs, "clipPath", { id: "bore" }); el(cp, "circle", { cx: CX, cy: CY, r: RB });
el(st, "circle", { cx: CX, cy: CY, r: RB, fill: "#F5FAEA", stroke: "#D8DBD3", "stroke-width": 3 });

  else if (k === "ArrowLeft") jump(-1);
}
addEventListener("keydown", e => {
  if (TVMODE) { tell({ tv: "key", key: e.key, code: e.keyCode }); e.preventDefault(); return; }
  if (e.key === "f" || e.key === "F") { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen(); return; }
  key(e.key); if (e.key === " ") e.preventDefault();
});
addEventListener("click", () => { if (TVMODE) tell({ tv: "key", key: " " }); else setPaused(!paused); });
addEventListener("message", e => {
  const m = e.data || {};
  if (m.cmd === "pause") setPaused(true);
  else if (m.cmd === "play") { if (T >= LOOP - 0.01) { seek(0); render(true); } setPaused(false); }
  else if (m.cmd === "seek") {
    seek(Math.max(0, Math.min(LOOP - 0.001, +m.t || 0))); render(true); tell({ tv: "time", t: T });
    if (m.play != null) setPaused(!m.play);
  }
  else if (m.cmd === "step") jump(m.dir || 1);
});
/* Mauszeiger nach 2 s ohne Bewegung ausblenden */

addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2000); });
